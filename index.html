<html lang="zh-Hant">
<head>

<title>逗點教室・年度行事曆大表 2026/7–2027/6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2756;--navy-soft:#27345f;--gold:#c9a227;--gold-soft:#e3c463;--ink:#1f2430;--muted:#6b7280;--hint:#9aa1ad;--line:#e6e8ef;--line-soft:#f0f1f6;--bg:#f6f7fb;--card:#fff;--navy-tint:#eef0f6;--plan:#85B7EB;--plan-bg:#E6F1FB;--plan-tx:#0c447c;--design:#EF9F27;--design-bg:#FAEEDA;--design-tx:#633806;--exec:#F0997B;--exec-bg:#FAECE7;--exec-tx:#993c1d;--after:#5DCAA5;--after-bg:#E1F5EE;--after-tx:#0F6E56;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 60px;}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;}
.hd{max-width:1320px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);transform:translateY(-1px);}
.brand h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:20px;margin:0;letter-spacing:.5px;}
.brand .yr{color:var(--gold);font-size:14px;font-weight:500;}
.hd .sub{color:#aeb6d2;font-size:12px;margin-top:2px;}
.toggle{display:flex;border:1px solid var(--gold);border-radius:8px;overflow:hidden;}
.toggle button{background:transparent;color:var(--gold);border:0;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.toggle button.on{background:var(--gold);color:var(--navy);font-weight:500;}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:120px;}
.stat .n{font-size:24px;font-weight:700;color:var(--navy);font-family:"Noto Serif TC",serif;}
.stat .l{font-size:12px;color:var(--muted);}
.focus{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
.focus h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--navy);}
.focus h2 .mtag{background:var(--navy);color:var(--gold);font-size:12px;padding:2px 10px;border-radius:20px;font-weight:500;}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
.pillrow .lbl{font-size:12px;color:var(--muted);margin-right:2px;}
.pillrow .yrlbl{font-size:11px;color:var(--gold-soft);background:var(--navy);padding:2px 8px;border-radius:6px;margin:0 2px;}
.pill{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.pill:hover{border-color:var(--navy);color:var(--navy);}
.pill.on{background:var(--navy);color:var(--gold);border-color:var(--navy);font-weight:500;}
.pill.mon.on{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.fcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s;background:#fff;}
.fcard:hover{border-color:var(--navy);transform:translateY(-1px);}
.fcard .ph{font-size:11px;font-weight:500;padding:1px 8px;border-radius:20px;display:inline-block;margin-bottom:5px;}
.fcard .nm{font-size:13px;font-weight:500;}
.fcard .un{font-size:11px;color:var(--hint);margin-top:3px;}
.focus .empty{color:var(--hint);font-size:13px;}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.filters label{font-size:12px;color:var(--muted);}
.filters select,.filters input{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
.filters input{min-width:200px;}
.filters .clear{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;}
.filters .clear:hover{border-color:var(--navy);color:var(--navy);}
.gtools{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.gtools button{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.gtools button:hover{border-color:var(--navy);color:var(--navy);}
.gtools .gt-hint{font-size:12px;color:var(--hint);}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center;}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;}
.legend .tip{color:var(--navy-soft);}
.gantt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.gscroll{overflow-x:auto;}
.grow{display:grid;grid-template-columns:228px repeat(12,minmax(48px,1fr));align-items:stretch;}
.ghead{background:var(--navy-tint);}
.ghead .gc{font-size:12px;color:var(--navy);text-align:center;padding:6px 0;font-weight:500;border-left:1px solid var(--line-soft);cursor:pointer;line-height:1.2;}
.ghead .gc .yy{display:block;font-size:9px;color:var(--hint);font-weight:400;}
.ghead .gc:hover{background:#dfe3f0;}
.ghead .glabel{padding:9px 14px;color:var(--muted);font-weight:500;text-align:left;cursor:default;}
.ghead .gc.cur{background:var(--navy);color:var(--gold);}
.ghead .gc.cur .yy{color:var(--gold-soft);}
.gc.yb,.cell.yb{border-left:2px solid var(--gold)!important;}
.unit-h{grid-column:1/-1;background:var(--navy);color:#fff;padding:8px 14px;font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.unit-h .cnt{font-size:11px;color:var(--gold-soft);font-weight:400;}
.unit-h .chev{transition:.2s;display:inline-block;}
.unit-h.collapsed .chev{transform:rotate(-90deg);}
.axis-h{grid-column:1/-1;background:#fafbff;color:var(--navy-soft);padding:5px 14px 5px 24px;font-size:12px;font-weight:500;border-top:1px solid var(--line-soft);}
.arow .alabel{padding:8px 12px 8px 14px;border-top:1px solid var(--line-soft);cursor:pointer;display:flex;flex-direction:column;gap:3px;background:#fff;}
.arow:hover .alabel{background:#fafbff;}
.arow .alabel .nm{font-size:13px;line-height:1.35;}
.arow .alabel .meta{display:flex;gap:5px;flex-wrap:wrap;}
.badge{font-size:10px;padding:1px 6px;border-radius:4px;line-height:1.5;}
.b-src{background:#eef0f6;color:var(--navy-soft);} .b-jz{background:#f3f1fb;color:#3c3489;}
.cell{border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft);position:relative;min-height:34px;display:flex;align-items:center;justify-content:center;}
.cell.cur{background:#fbfaf2;}
.bar{position:absolute;left:3px;right:3px;height:16px;border-radius:4px;}
.bar.plan{background:var(--plan);}.bar.design{background:var(--design);}.bar.exec{background:var(--exec);}.bar.after{background:var(--after);}
.star{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--exec-tx);z-index:2;}
.listv{display:none;}.listv.on{display:block;}.gantt.hidden{display:none;}
.lgroup{margin-bottom:8px;}
.litem{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer;}
.litem:hover{border-color:var(--navy);}
.litem .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.litem .mini{display:flex;gap:2px;margin-top:8px;}
.litem .mc{flex:1;height:6px;border-radius:2px;background:var(--line-soft);}
.litem .mc.plan{background:var(--plan);}.litem .mc.design{background:var(--design);}.litem .mc.exec{background:var(--exec);}.litem .mc.after{background:var(--after);}
.scrim{position:fixed;inset:0;background:rgba(20,28,55,.4);opacity:0;pointer-events:none;transition:.2s;z-index:60;}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:-520px;width:500px;max-width:92vw;height:100%;background:#fff;z-index:70;transition:.25s;overflow-y:auto;box-shadow:-4px 0 24px rgba(20,28,55,.18);}
.drawer.on{right:0;}
.dhd{background:var(--navy);color:#fff;padding:18px 20px;position:sticky;top:0;}
.dhd h3{margin:0;font-size:18px;font-family:"Noto Serif TC",serif;}
.dhd .dmeta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.dhd .dmeta .badge{background:rgba(255,255,255,.14);color:#fff;}
.dclose{position:absolute;top:16px;right:16px;background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1;}
.dbody{padding:18px 20px;}
.mblock{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft);}
.mblock .mo{flex:0 0 64px;font-weight:700;color:var(--navy);font-size:13px;font-family:"Noto Serif TC",serif;display:flex;flex-direction:column;align-items:flex-start;gap:3px;}
.mblock .mo .yy{font-size:9px;color:var(--hint);font-weight:400;}
.mblock .mo .pp{font-size:10px;font-weight:500;padding:1px 6px;border-radius:4px;}
.mblock .tasks{flex:1;font-size:13px;}
.mblock .tasks div{padding:1px 0;}
.mblock.cur{background:#fbfaf2;border-radius:8px;}
.pp.plan{background:var(--plan-bg);color:var(--plan-tx);}.pp.design{background:var(--design-bg);color:var(--design-tx);}.pp.exec{background:var(--exec-bg);color:var(--exec-tx);}.pp.after{background:var(--after-bg);color:var(--after-tx);}
footer{margin-top:30px;font-size:12px;color:var(--hint);text-align:center;}
.miss{color:var(--hint);font-size:12px;padding:14px;}
@media(max-width:720px){.grow{grid-template-columns:140px repeat(12,minmax(36px,1fr));}.drawer{width:100%;}}
</style></head>

  document.getElementById('monthPills').innerHTML=mp;
  let up='<span class="lbl">單位</span>';
  DATA.unitOrder.forEach(u=>{up+=`<button class="pill${u===focusUnit?' on':''}" onclick="setFocusUnit('${u}')">${u}</button>`;});
  document.getElementById('unitPills').innerHTML=up;
  const f=getFilters();
  const list=DATA.activities.filter(a=>a.unit===focusUnit&&a.months[curMonth]&&matchA(a,f));
  const el=document.getElementById('focusGroups');
  if(!list.length){el.innerHTML=`<div class="empty">${focusUnit}・${curMonth}月 沒有需要準備的項目。</div>`;return;}
  el.innerHTML='<div class="fcards">'+list.map(a=>{const c=a.months[curMonth];const s=phStyle(c.phase);return `<div class="fcard" onclick="openDrawer(${a.id})"><span class="ph" style="background:${s.bg};color:${s.tx}">${PHASE[c.phase]}</span><div class="nm">${a.name}</div><div class="un">${a.axis}</div></div>`;}).join('')+'</div>';
}
function groupByUnit(acts){const g={};acts.forEach(a=>{(g[a.unit]=g[a.unit]||[]).push(a);});return DATA.unitOrder.filter(u=>g[u]).map(u=>[u,g[u]]);}
function cellHTML(a,m){const c=a.months[m];const cur=(m===curMonth)?' cur':'';const yb=(m===1)?' yb':'';if(!c)return `<div class="cell${cur}${yb}"></div>`;const star=(a.event&&a.event.includes(m))?'<span class="star">★</span>':'';return `<div class="cell${cur}${yb}" title="${m}月(${YEAR[m]}) ${PHASE[c.phase]}：${c.ops.join('；').replace(/"/g,'')}">${star}<span class="bar ${c.phase}"></span></div>`;}
function render(){renderStats();renderFocus();if(view==='gantt')renderGantt();else renderList();}
function renderGantt(){
  const acts=filtered();
  let h='<div class="grow ghead"><div class="gc glabel">活動 / 負責單位</div>';
  MO.forEach(m=>{const yb=(m===1)?' yb':'';h+=`<div class="gc${m===curMonth?' cur':''}${yb}" onclick="setMonth(${m})" title="檢視 ${m} 月(${YEAR[m]})">${m}<span class="yy">${YEAR[m]}</span></div>`;});
  h+='</div>';
  const groups=groupByUnit(acts);
  if(!groups.length)h+='<div class="miss">沒有符合條件的活動。</div>';
  groups.forEach(([unit,list])=>{const col=collapsed[unit];
    h+=`<div class="grow"><div class="unit-h${col?' collapsed':''}" onclick="toggleUnit('${unit}')"><span><span class="chev">▾</span> ${unit}</span><span class="cnt">${list.length} 項</span></div></div>`;
    if(col)return;
    const byAxis={};list.forEach(a=>{(byAxis[a.axis]=byAxis[a.axis]||[]).push(a);});
    Object.keys(byAxis).forEach(ax=>{h+=`<div class="grow"><div class="axis-h">${ax}</div></div>`;
      byAxis[ax].forEach(a=>{h+=`<div class="grow arow" onclick="openDrawer(${a.id})"><div class="alabel"><span class="nm">${a.name}</span><span class="meta">${a.source==='節奏'?'<span class="badge b-jz">行銷節奏</span>':a.source==='合併'?'<span class="badge b-src">營運+行銷</span>':'<span class="badge b-src">營運</span>'}</span></div>`;MO.forEach(m=>h+=cellHTML(a,m));h+='</div>';});});
  });
  document.getElementById('gscroll').innerHTML=h;
}
function renderList(){const groups=groupByUnit(filtered());let h='';if(!groups.length)h='<div class="miss">沒有符合條件的活動。</div>';
  groups.forEach(([unit,list])=>{h+=`<div class="lgroup"><div class="unit-h" style="border-radius:10px;margin-bottom:6px;">${unit}<span class="cnt">${list.length} 項</span></div>`;
    list.forEach(a=>{let mini='';MO.forEach(m=>{const c=a.months[m];mini+=`<div class="mc ${c?c.phase:''}"></div>`;});
      h+=`<div class="litem" onclick="openDrawer(${a.id})"><div class="top"><span style="font-weight:500">${a.name}</span><span class="badge ${a.source==='節奏'?'b-jz':'b-src'}">${a.source==='節奏'?'行銷節奏':a.source==='合併'?'營運+行銷':'營運'}</span><span style="color:var(--hint);font-size:12px">${a.axis}</span></div><div class="mini">${mini}</div></div>`;});h+='</div>';});
  document.getElementById('listv').innerHTML=h;}
function setView(v){view=v;tGantt.classList.toggle('on',v==='gantt');tList.classList.toggle('on',v==='list');document.getElementById('gantt').classList.toggle('hidden',v!=='gantt');document.getElementById('listv').classList.toggle('on',v==='list');render();}
function openDrawer(id){const a=DATA.activities.find(x=>x.id===id);if(!a)return;let body='<div>';
  MO.forEach(m=>{const c=a.months[m];if(!c)return;const cur=(m===curMonth)?' cur':'';const star=(a.event&&a.event.includes(m))?' ★':'';
    body+=`<div class="mblock${cur}"><div class="mo">${m}月<span class="yy">${YEAR[m]}</span>${star}<span class="pp ${c.phase}">${PHASE[c.phase]}</span></div><div class="tasks">${c.ops.map(t=>`<div>· ${t}</div>`).join('')}</div></div>`;});
  body+='</div>';
  const sl=a.source==='節奏'?'行銷產銷節奏':a.source==='合併'?'營運總表＋行銷節奏':'營運總表';
  document.getElementById('drawer').innerHTML=`<div class="dhd"><button class="dclose" onclick="closeDrawer()">×</button><h3>${a.name}</h3><div class="dmeta"><span class="badge">${a.unit}</span><span class="badge">${a.axis}</span><span class="badge">${sl}</span></div></div><div class="dbody">${body}</div>`;
  document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on');}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
initFilters();render();
</script></body></html>
