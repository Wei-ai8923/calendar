<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逗點教室・年度行事曆大表 2026/7–2027/6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2756;--navy-soft:#27345f;--gold:#c9a227;--gold-soft:#e3c463;--ink:#1f2430;--muted:#6b7280;--hint:#9aa1ad;--line:#e6e8ef;--line-soft:#f0f1f6;--bg:#f6f7fb;--card:#fff;--navy-tint:#eef0f6;--plan:#85B7EB;--plan-bg:#E6F1FB;--plan-tx:#0c447c;--design:#EF9F27;--design-bg:#FAEEDA;--design-tx:#633806;--exec:#F0997B;--exec-bg:#FAECE7;--exec-tx:#993c1d;--after:#5DCAA5;--after-bg:#E1F5EE;--after-tx:#0F6E56;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 60px;}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;}
.hd{max-width:1320px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);transform:translateY(-1px);}
.brand h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:20px;margin:0;letter-spacing:.5px;}
.brand .yr{color:var(--gold);font-size:14px;font-weight:500;}
.hd .sub{color:#aeb6d2;font-size:12px;margin-top:2px;}
.toggle{display:flex;border:1px solid var(--gold);border-radius:8px;overflow:hidden;}
.toggle button{background:transparent;color:var(--gold);border:0;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.toggle button.on{background:var(--gold);color:var(--navy);font-weight:500;}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:120px;}
.stat .n{font-size:24px;font-weight:700;color:var(--navy);font-family:"Noto Serif TC",serif;}
.stat .l{font-size:12px;color:var(--muted);}
.ctrl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center;}
.pillrow:last-child{margin-bottom:0;}
.pillrow .lbl{font-size:12px;color:var(--muted);margin-right:4px;min-width:34px;}
.pillrow .yrlbl{font-size:11px;color:var(--gold-soft);background:var(--navy);padding:2px 8px;border-radius:6px;margin:0 2px;}
.pill{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.pill:hover{border-color:var(--navy);color:var(--navy);}
.pill.all.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.pill.on{background:var(--navy);color:var(--gold);border-color:var(--navy);font-weight:500;}
.pill.mon.on{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.status{font-size:12px;color:var(--navy-soft);margin-top:4px;}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.filters label{font-size:12px;color:var(--muted);}
.filters select,.filters input{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
.filters input{min-width:200px;}
.gtools{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.gtools button{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.gtools button:hover{border-color:var(--navy);color:var(--navy);}
.gtools .gt-hint{font-size:12px;color:var(--hint);}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center;}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;}
/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px;}
.caltile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;transition:.15s;}
.caltile:hover{border-color:var(--navy-soft);}
.caltile.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
.caltile.dim{opacity:.45;}
.calhd{font-weight:600;color:var(--navy);font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;font-family:"Noto Serif TC",serif;}
.calhd .yy{font-size:10px;color:var(--hint);font-weight:400;}
.calhd .cnt{margin-left:auto;font-size:11px;color:#fff;background:var(--navy-soft);border-radius:10px;padding:0 7px;font-weight:400;}
.calchips{display:flex;flex-direction:column;gap:4px;}
.chip{font-size:11px;padding:3px 8px;border-radius:6px;border-left:3px solid;cursor:pointer;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip.plan{background:var(--plan-bg);color:var(--plan-tx);border-color:var(--plan);}
.chip.design{background:var(--design-bg);color:var(--design-tx);border-color:var(--design);}
.chip.exec{background:var(--exec-bg);color:var(--exec-tx);border-color:var(--exec);}
.chip.after{background:var(--after-bg);color:var(--after-tx);border-color:var(--after);}
.calempty{color:var(--hint);font-size:11px;}
.mdetail{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.mdetail h3{margin:0 0 10px;font-size:14px;color:var(--navy);}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.fcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;}
.fcard:hover{border-color:var(--navy);}
.fcard .ph{font-size:11px;font-weight:500;padding:1px 8px;border-radius:20px;display:inline-block;margin-bottom:5px;}
.fcard .nm{font-size:13px;font-weight:500;}
.fcard .un{font-size:11px;color:var(--hint);margin-top:3px;}
/* gantt */
.gantt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.gscroll{overflow-x:auto;}
.grow{display:grid;grid-template-columns:228px repeat(12,minmax(48px,1fr));align-items:stretch;}
.ghead{background:var(--navy-tint);}
.ghead .gc{font-size:12px;color:var(--navy);text-align:center;padding:6px 0;font-weight:500;border-left:1px solid var(--line-soft);cursor:pointer;line-height:1.2;}
.ghead .gc .yy{display:block;font-size:9px;color:var(--hint);font-weight:400;}
.ghead .gc:hover{background:#dfe3f0;}
.ghead .glabel{padding:9px 14px;color:var(--muted);font-weight:500;text-align:left;cursor:default;}
.ghead .gc.cur{background:var(--navy);color:var(--gold);}.ghead .gc.cur .yy{color:var(--gold-soft);}
.gc.yb,.cell.yb{border-left:2px solid var(--gold)!important;}
.unit-h{grid-column:1/-1;background:var(--navy);color:#fff;padding:8px 14px;font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.unit-h .cnt{font-size:11px;color:var(--gold-soft);font-weight:400;}
.unit-h .chev{transition:.2s;display:inline-block;}.unit-h.collapsed .chev{transform:rotate(-90deg);}
.axis-h{grid-column:1/-1;background:#fafbff;color:var(--navy-soft);padding:5px 14px 5px 24px;font-size:12px;font-weight:500;border-top:1px solid var(--line-soft);}
.arow .alabel{padding:8px 12px 8px 14px;border-top:1px solid var(--line-soft);cursor:pointer;display:flex;flex-direction:column;gap:3px;background:#fff;}
.arow:hover .alabel{background:#fafbff;}
.arow .alabel .nm{font-size:13px;line-height:1.35;}
.arow .alabel .meta{display:flex;gap:5px;flex-wrap:wrap;}
.badge{font-size:10px;padding:1px 6px;border-radius:4px;line-height:1.5;}
.b-src{background:#eef0f6;color:var(--navy-soft);}.b-jz{background:#f3f1fb;color:#3c3489;}
.cell{border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft);position:relative;min-height:34px;display:flex;align-items:center;justify-content:center;}
.cell.cur{background:#fbfaf2;}
.bar{position:absolute;left:3px;right:3px;height:16px;border-radius:4px;}
.bar.plan{background:var(--plan);}.bar.design{background:var(--design);}.bar.exec{background:var(--exec);}.bar.after{background:var(--after);}
.star{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--exec-tx);z-index:2;}
.listv{display:none;}.listv.on{display:block;}.hidden{display:none!important;}
.lgroup{margin-bottom:8px;}
.litem{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer;}
.litem:hover{border-color:var(--navy);}
.litem .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.litem .mini{display:flex;gap:2px;margin-top:8px;}
.litem .mc{flex:1;height:6px;border-radius:2px;background:var(--line-soft);}
.litem .mc.plan{background:var(--plan);}.litem .mc.design{background:var(--design);}.litem .mc.exec{background:var(--exec);}.litem .mc.after{background:var(--after);}
.scrim{position:fixed;inset:0;background:rgba(20,28,55,.4);opacity:0;pointer-events:none;transition:.2s;z-index:60;}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:-520px;width:500px;max-width:92vw;height:100%;background:#fff;z-index:70;transition:.25s;overflow-y:auto;box-shadow:-4px 0 24px rgba(20,28,55,.18);}
.drawer.on{right:0;}
.dhd{background:var(--navy);color:#fff;padding:18px 20px;position:sticky;top:0;}
.dhd h3{margin:0;font-size:18px;font-family:"Noto Serif TC",serif;}
.dhd .dmeta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}.dhd .dmeta .badge{background:rgba(255,255,255,.14);color:#fff;}
.dclose{position:absolute;top:16px;right:16px;background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1;}
.dbody{padding:18px 20px;}
.mblock{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft);}
.mblock .mo{flex:0 0 64px;font-weight:700;color:var(--navy);font-size:13px;font-family:"Noto Serif TC",serif;display:flex;flex-direction:column;align-items:flex-start;gap:3px;}
.mblock .mo .yy{font-size:9px;color:var(--hint);font-weight:400;}
.mblock .mo .pp{font-size:10px;font-weight:500;padding:1px 6px;border-radius:4px;}
.mblock .tasks{flex:1;font-size:13px;}.mblock .tasks div{padding:1px 0;}
.mblock.cur{background:#fbfaf2;border-radius:8px;}
.pp.plan{background:var(--plan-bg);color:var(--plan-tx);}.pp.design{background:var(--design-bg);color:var(--design-tx);}.pp.exec{background:var(--exec-bg);color:var(--exec-tx);}.pp.after{background:var(--after-bg);color:var(--after-tx);}
footer{margin-top:30px;font-size:12px;color:var(--hint);text-align:center;}
.miss{color:var(--hint);font-size:12px;padding:14px;}

:root{--de-all:#1a2756;--de-all-bg:#e7e9f1;--de-es:#2f6fc2;--de-es-bg:#e4eefb;--de-jh:#b3791a;--de-jh-bg:#faf0db;--de-hs:#c1503c;--de-hs-bg:#fae8e4;--de-adm:#2f8a78;--de-adm-bg:#e0f3ee;--de-mkt:#6a5fae;--de-mkt-bg:#ece9f8;}
.hide{display:none!important;}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;flex-wrap:wrap;}
.navg{display:flex;align-items:center;gap:8px;}
.navg button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--navy);font-family:inherit;}
.navg button:hover{border-color:var(--navy);}
.navg .mtitle{font-family:"Noto Serif TC",serif;font-size:20px;color:var(--navy);font-weight:600;min-width:140px;text-align:center;}
.navg .todaybtn{width:auto;padding:0 12px;font-size:12px;}
.dfilter{display:flex;gap:6px;flex-wrap:wrap;}
.dpill{font-size:12px;padding:5px 11px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.dpill:hover{border-color:var(--navy);}.dpill.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:500;}
.dlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center;}
.dlegend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;}
.dow-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.dow-head div{text-align:center;font-size:12px;color:var(--muted);font-weight:500;padding:2px 0;}
.dow-head div.we{color:var(--de-hs);}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;}
.day.spill{background:#fafbfc;}
.day.today{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
.dnum{font-size:13px;color:var(--ink);font-weight:600;display:flex;align-items:baseline;gap:6px;font-family:"Noto Serif TC",serif;}
.day.spill .dnum{color:var(--hint);}
.dnum .dow{display:none;font-size:11px;color:var(--muted);font-weight:400;}
.dnum .tdot{margin-left:auto;font-size:10px;color:#fff;background:var(--navy);border-radius:10px;padding:0 6px;font-family:"Noto Sans TC";}
.devs{display:flex;flex-direction:column;gap:3px;}
.ev{font-size:11px;padding:2px 6px;border-radius:5px;border-left:3px solid;cursor:pointer;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev.dall{background:var(--de-all-bg);color:var(--de-all);border-color:var(--de-all);}
.ev.des{background:var(--de-es-bg);color:var(--de-es);border-color:var(--de-es);}
.ev.djh{background:var(--de-jh-bg);color:var(--de-jh);border-color:var(--de-jh);}
.ev.dhs{background:var(--de-hs-bg);color:var(--de-hs);border-color:var(--de-hs);}
.ev.dadm{background:var(--de-adm-bg);color:var(--de-adm);border-color:var(--de-adm);}
.ev.dmkt{background:var(--de-mkt-bg);color:var(--de-mkt);border-color:var(--de-mkt);}
.emptymsg{grid-column:1/-1;text-align:center;color:var(--hint);font-size:13px;padding:30px;}
.evrow{padding:8px 0;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:flex-start;}
.evtag{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-top:1px;}
@media(max-width:680px){
  #calWrap .dow-head{display:none;}
  #calWrap .calgrid{grid-template-columns:1fr;gap:6px;}
  #calWrap .day{flex-direction:row;align-items:flex-start;min-height:auto;padding:8px 10px;gap:10px;}
  #calWrap .day.spill,#calWrap .day.empty{display:none;}
  #calWrap .day .dnum{flex-direction:column;align-items:flex-start;gap:1px;min-width:46px;flex:0 0 46px;}
  #calWrap .day .dnum .dow{display:block;}
  #calWrap .day .devs{flex:1;}
}
@media(max-width:720px){.grow{grid-template-columns:140px repeat(12,minmax(36px,1fr));}.drawer{width:100%;}}
</style></head><body>
<header><div class="hd">
  <div><div class="brand"><span class="dot"></span><h1>逗點教室・年度行事曆大表</h1><span class="yr">2026/7 – 2027/6</span></div>
  <div class="sub">整合「行銷節奏」與「年度總表」・以 2026 年 7 月至 2027 年 6 月為一個年度循環</div></div>
  <div class="toggle"><button id="tCal" class="on" onclick="setView('cal')">日曆檢視</button><button id="tGantt" onclick="setView('gantt')">甘特檢視</button><button id="tList" onclick="setView('list')">清單檢視</button></div>
</div></header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="ctrl">
    <div class="pillrow" id="monthPills"></div>
    <div class="pillrow" id="unitPills"></div>
    <div class="status" id="status"></div>
  </div>
  <div class="filters">
    <label>主軸</label><select id="fAxis"></select>
    <input id="fSearch" placeholder="搜尋活動 / 任務關鍵字…">
    <button class="pill all" style="border-radius:8px" onclick="clearAll()">清除全部篩選</button>
  </div>
  <div class="legend">
    <span><span class="sw" style="background:var(--plan)"></span>規劃</span><span><span class="sw" style="background:var(--design)"></span>設計行銷</span>
    <span><span class="sw" style="background:var(--exec)"></span>執行</span><span><span class="sw" style="background:var(--after)"></span>成果</span>
    <span style="color:var(--hint)">★＝活動登場月　點月份／單位＝篩選，再點一次＝取消</span>
  </div>
  <!-- 日曆檢視 -->
  <div id="calWrap">
    <div class="calbar">
      <div class="navg"><button onclick="moveMonth(-1)">‹</button><span class="mtitle" id="mtitle">2026年6月</span><button onclick="moveMonth(1)">›</button><button class="todaybtn" onclick="goToday()">回到本月</button></div>
      <div class="dfilter" id="dfilter"></div>
    </div>
    <div class="dlegend">
      <span><span class="sw" style="background:var(--de-all)"></span>全校</span><span><span class="sw" style="background:var(--de-es)"></span>國小</span>
      <span><span class="sw" style="background:var(--de-jh)"></span>國中</span><span><span class="sw" style="background:var(--de-hs)"></span>高中</span>
      <span><span class="sw" style="background:var(--de-adm)"></span>行政</span><span><span class="sw" style="background:var(--de-mkt)"></span>品牌行銷</span>
    </div>
    <div class="dow-head"><div class="we">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="we">六</div></div>
    <div class="calgrid" id="calgrid"></div>
  </div>
  <!-- 甘特檢視 -->
  <div class="gtools hidden" id="gtools"><button onclick="expandAll(true)">全部展開</button><button onclick="expandAll(false)">全部收合</button><span class="gt-hint">點單位列可收合／展開</span></div>
  <div class="gantt hidden" id="gantt"><div class="gscroll" id="gscroll"></div></div>
  <!-- 清單檢視 -->
  <div class="listv" id="listv"></div>
  <footer>逗點教室 COMMA・國高中處營運 ｜ 年度循環 2026/7–2027/6 ｜ 資料來源：行銷節奏＋2026總表(7–12月)＋2027總表(1–6月)</footer>
</div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>

function uniqueAxes(){const s=new Set(DATA.activities.map(a=>a.axis));return['招生戰線','活動企劃','規劃事項','行銷節奏'].filter(x=>s.has(x));}
function initFilters(){fAxis.innerHTML='<option value="">全部主軸</option>'+uniqueAxes().map(x=>`<option>${x}</option>`).join('');fAxis.onchange=render;document.getElementById('fSearch').oninput=render;}
function clearAll(){selMonth=null;selUnit=null;fAxis.value='';document.getElementById('fSearch').value='';render();}
function getF(){return{unit:selUnit,axis:fAxis.value,q:document.getElementById('fSearch').value.trim().toLowerCase()};}
function matchA(a,f){if(f.unit&&a.unit!==f.unit)return false;if(f.axis&&a.axis!==f.axis)return false;if(f.q){let hay=a.name+' '+a.unit+' '+a.axis;for(const m in a.months)hay+=' '+a.months[m].ops.join(' ');if(!hay.toLowerCase().includes(f.q))return false;}return true;}
function filtered(){const f=getF();return DATA.activities.filter(a=>matchA(a,f));}
function toggleMonth(m){selMonth=(selMonth===m)?null:m;render();}
function toggleUnit(u){selUnit=(selUnit===u)?null:u;render();}
function toggleCollapse(u){collapsed[u]=!collapsed[u];renderGantt();}
function expandAll(o){DATA.unitOrder.forEach(u=>collapsed[u]=!o);renderGantt();}
function phStyle(ph){return{bg:{plan:'var(--plan-bg)',design:'var(--design-bg)',exec:'var(--exec-bg)',after:'var(--after-bg)'}[ph],tx:{plan:'var(--plan-tx)',design:'var(--design-tx)',exec:'var(--exec-tx)',after:'var(--after-tx)'}[ph]};}
function renderControls(){
  let mp='<span class="lbl">月份</span>';
  MO.forEach(m=>{if(m===7)mp+='<span class="yrlbl">2026</span>';if(m===1)mp+='<span class="yrlbl">2027</span>';mp+=`<button class="pill mon${m===selMonth?' on':''}" onclick="toggleMonth(${m})">${m}月</button>`;});
  document.getElementById('monthPills').innerHTML=mp;
  let up='<span class="lbl">單位</span>';
  DATA.unitOrder.forEach(u=>{up+=`<button class="pill${u===selUnit?' on':''}" onclick="toggleUnit('${u}')">${u}</button>`;});
  document.getElementById('unitPills').innerHTML=up;
  document.getElementById('status').textContent='目前顯示：'+(selUnit||'全部單位')+'　／　'+(selMonth?(selMonth+'月('+YEAR[selMonth]+')'):'全部月份');
}
function renderStats(){const acts=filtered();const tm=selMonth?acts.filter(a=>a.months[selMonth]).length:acts.length;
  document.getElementById('stats').innerHTML=`<div class="stat"><div class="n">${acts.length}</div><div class="l">活動（目前篩選）</div></div><div class="stat"><div class="n">${tm}</div><div class="l">${selMonth?selMonth+'月有任務':'全年活動'}</div></div><div class="stat"><div class="n">${DATA.unitOrder.length}</div><div class="l">負責單位</div></div>`;}
const DIVSHORT={'全體':'全校','國小':'國小','國中':'國中','高中':'高中','行政':'行政','品牌行銷':'品牌'};
const DIVCLS={'全體':'dall','國小':'des','國中':'djh','高中':'dhs','行政':'dadm','品牌行銷':'dmkt'};
const DOW=['日','一','二','三','四','五','六'];
const _t=new Date(),TY=_t.getFullYear(),TM=_t.getMonth()+1,TD=_t.getDate();
let calYear=2026, calMonth=(TY===2026?TM:6); if(!DAY[String(calMonth)])calMonth=6;
let dFilter='';
function evClass(divs){const s=new Set(divs);if(s.has('全體')||(s.has('國小')&&s.has('國中')&&s.has('高中')))return 'dall';if(s.size>1)return 'dall';if(s.has('行政'))return 'dadm';if(s.has('品牌行銷'))return 'dmkt';if(s.has('國小'))return 'des';if(s.has('國中'))return 'djh';if(s.has('高中'))return 'dhs';return 'dall';}
function evMatch(ev){if(!dFilter)return true;if(dFilter==='dall')return evClass(ev.divs)==='dall';return ev.divs.some(d=>DIVCLS[d]===dFilter);}
function renderFilter(){const opts=[['','全部'],['dall','全校'],['des','國小'],['djh','國中'],['dhs','高中'],['dadm','行政'],['dmkt','品牌行銷']];document.getElementById('dfilter').innerHTML=opts.map(([v,l])=>`<button class="dpill${dFilter===v?' on':''}" onclick="setDFilter('${v}')">${l}</button>`).join('');}
function setDFilter(v){dFilter=v;renderCalendar();}
function moveMonth(d){let m=calMonth+d,y=calYear;if(m<1){m=12;y--;}if(m>12){m=1;y++;}calMonth=m;calYear=y;renderCalendar();}
function goToday(){calYear=2026;calMonth=(TY===2026?TM:6);renderCalendar();}
function renderCalendar(){
  document.getElementById('mtitle').textContent=calYear+'年'+calMonth+'月';renderFilter();
  const md=(calYear===2026)?(DAY[String(calMonth)]||{}):{};
  const startDow=new Date(calYear,calMonth-1,1).getDay(),dim=new Date(calYear,calMonth,0).getDate(),prevDim=new Date(calYear,calMonth-1,0).getDate();
  let cells=[];for(let i=0;i<startDow;i++)cells.push({spill:1,n:prevDim-startDow+1+i});for(let d=1;d<=dim;d++)cells.push({n:d});while(cells.length%7!==0)cells.push({spill:1,n:cells.length-(startDow+dim)+1});
  let h='',anyEv=false;
  cells.forEach(c=>{if(c.spill){h+=`<div class="day spill"><div class="dnum">${c.n}</div></div>`;return;}
    const evs=(md[String(c.n)]||[]).filter(evMatch);if(evs.length)anyEv=true;
    const isToday=(calYear===TY&&calMonth===TM&&c.n===TD),dow=DOW[new Date(calYear,calMonth-1,c.n).getDay()];
    h+=`<div class="day${isToday?' today':''}${evs.length?'':' empty'}"><div class="dnum"><span class="dow">週${dow}</span>${c.n}${isToday?'<span class="tdot">今天</span>':''}</div><div class="devs">`;
    evs.forEach(e=>{h+=`<div class="ev ${evClass(e.divs)}" onclick="openDay(${calMonth},${c.n})" title="${e.text}">${e.text}</div>`;});
    h+='</div></div>';});
  if(!anyEv&&Object.keys(md).length===0)h+=`<div class="emptymsg">${calYear}年${calMonth}月 目前沒有逐日資料（此月份版型尚未填寫）。</div>`;
  document.getElementById('calgrid').innerHTML=h;
}
function openDay(m,d){const evs=(DAY[String(m)]||{})[String(d)]||[];const dow=DOW[new Date(2026,m-1,d).getDay()];
  let body=evs.map(e=>{const c=evClass(e.divs),tags=e.divs.map(x=>DIVSHORT[x]).join('・');return `<div class="evrow"><span class="evtag ev ${c}" style="border:0">${tags}</span><div>${e.text}</div></div>`;}).join('')||'<div style="color:var(--hint)">當日無事件</div>';
  document.getElementById('drawer').innerHTML=`<div class="dhd"><button class="dclose" onclick="closeDrawer()">×</button><h3>${m}月${d}日（週${dow}）</h3><div class="dmeta"><span class="badge">2026年</span></div></div><div class="dbody">${body}</div>`;
  document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on');}
function groupByUnit(acts){const g={};acts.forEach(a=>{(g[a.unit]=g[a.unit]||[]).push(a);});return DATA.unitOrder.filter(u=>g[u]).map(u=>[u,g[u]]);}
function cellHTML(a,m){const c=a.months[m];const cur=(m===selMonth)?' cur':'';const yb=(m===1)?' yb':'';if(!c)return `<div class="cell${cur}${yb}"></div>`;const star=(a.event&&a.event.includes(m))?'<span class="star">★</span>':'';return `<div class="cell${cur}${yb}" title="${m}月(${YEAR[m]}) ${PHASE[c.phase]}：${c.ops.join('；').replace(/"/g,'')}">${star}<span class="bar ${c.phase}"></span></div>`;}
function renderGantt(){
  const acts=filtered();
  let h='<div class="grow ghead"><div class="gc glabel">活動 / 負責單位</div>';
  MO.forEach(m=>{const yb=(m===1)?' yb':'';h+=`<div class="gc${m===selMonth?' cur':''}${yb}" onclick="toggleMonth(${m})" title="${m}月(${YEAR[m]})">${m}<span class="yy">${YEAR[m]}</span></div>`;});
  h+='</div>';
  const groups=groupByUnit(acts);
  if(!groups.length)h+='<div class="miss">沒有符合條件的活動。</div>';
  groups.forEach(([unit,list])=>{const col=(selUnit?false:collapsed[unit]);
    h+=`<div class="grow"><div class="unit-h${col?' collapsed':''}" onclick="toggleCollapse('${unit}')"><span><span class="chev">▾</span> ${unit}</span><span class="cnt">${list.length} 項</span></div></div>`;
    if(col)return;
    const byAxis={};list.forEach(a=>{(byAxis[a.axis]=byAxis[a.axis]||[]).push(a);});
    Object.keys(byAxis).forEach(ax=>{h+=`<div class="grow"><div class="axis-h">${ax}</div></div>`;
      byAxis[ax].forEach(a=>{h+=`<div class="grow arow" onclick="openDrawer(${a.id})"><div class="alabel"><span class="nm">${a.name}</span><span class="meta">${a.source==='節奏'?'<span class="badge b-jz">行銷節奏</span>':'<span class="badge b-src">營運</span>'}</span></div>`;MO.forEach(m=>h+=cellHTML(a,m));h+='</div>';});});
  });
  document.getElementById('gscroll').innerHTML=h;
}
function renderList(){const groups=groupByUnit(filtered());let h='';if(!groups.length)h='<div class="miss">沒有符合條件的活動。</div>';
  groups.forEach(([unit,list])=>{h+=`<div class="lgroup"><div class="unit-h" style="border-radius:10px;margin-bottom:6px;">${unit}<span class="cnt">${list.length} 項</span></div>`;
    list.forEach(a=>{let mini='';MO.forEach(m=>{const c=a.months[m];mini+=`<div class="mc ${c?c.phase:''}"></div>`;});
      h+=`<div class="litem" onclick="openDrawer(${a.id})"><div class="top"><span style="font-weight:500">${a.name}</span><span class="badge ${a.source==='節奏'?'b-jz':'b-src'}">${a.source==='節奏'?'行銷節奏':'營運'}</span><span style="color:var(--hint);font-size:12px">${a.axis}</span></div><div class="mini">${mini}</div></div>`;});h+='</div>';});
  document.getElementById('listv').innerHTML=h;}
function render(){
  const cal=view==='cal';
  document.getElementById('stats').classList.toggle('hide',cal);
  document.querySelectorAll('.ctrl,.filters,.legend').forEach(e=>e.classList.toggle('hide',cal));
  document.getElementById('gtools').classList.toggle('hidden',cal||view!=='gantt');
  document.getElementById('calWrap').classList.toggle('hide',!cal);
  document.getElementById('gantt').classList.toggle('hidden',view!=='gantt');
  document.getElementById('listv').classList.toggle('on',view==='list');
  if(cal){renderCalendar();}
  else{renderControls();renderStats();if(view==='gantt')renderGantt();else renderList();}
}
function setView(v){view=v;tCal.classList.toggle('on',v==='cal');tGantt.classList.toggle('on',v==='gantt');tList.classList.toggle('on',v==='list');render();}
function openDrawer(id){const a=DATA.activities.find(x=>x.id===id);if(!a)return;let body='<div>';
  MO.forEach(m=>{const c=a.months[m];if(!c)return;const cur=(m===selMonth)?' cur':'';const star=(a.event&&a.event.includes(m))?' ★':'';
    body+=`<div class="mblock${cur}"><div class="mo">${m}月<span class="yy">${YEAR[m]}</span>${star}<span class="pp ${c.phase}">${PHASE[c.phase]}</span></div><div class="tasks">${c.ops.map(t=>`<div>· ${t}</div>`).join('')}</div></div>`;});
  body+='</div>';const sl=a.source==='節奏'?'行銷節奏':'營運總表';
  document.getElementById('drawer').innerHTML=`<div class="dhd"><button class="dclose" onclick="closeDrawer()">×</button><h3>${a.name}</h3><div class="dmeta"><span class="badge">${a.unit}</span><span class="badge">${a.axis}</span><span class="badge">${sl}</span></div></div><div class="dbody">${body}</div>`;
  document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on');}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
initFilters();render();
</script></body></html>
