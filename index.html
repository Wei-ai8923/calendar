<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逗點教室・年度行事曆大表</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2756;--navy-soft:#27345f;--gold:#c9a227;--gold-soft:#e3c463;--ink:#1f2430;--muted:#6b7280;--hint:#9aa1ad;--line:#e6e8ef;--line-soft:#f0f1f6;--bg:#f6f7fb;--card:#fff;--navy-tint:#eef0f6;--ghtop:52px;
--plan:#85B7EB;--plan-bg:#E6F1FB;--plan-tx:#0c447c;--design:#EF9F27;--design-bg:#FAEEDA;--design-tx:#633806;--exec:#F0997B;--exec-bg:#FAECE7;--exec-tx:#993c1d;--after:#5DCAA5;--after-bg:#E1F5EE;--after-tx:#0F6E56;
--d-all:#707888;--d-all-bg:#eceef2;--d-all-tx:#3d4452;--d-es:#c9a227;--d-es-bg:#f9f1d3;--d-es-tx:#876613;--d-jh:#0361BF;--d-jh-bg:#e2eefb;--d-jh-tx:#024a8f;--d-hs:#2f9268;--d-hs-bg:#e0f0e8;--d-hs-tx:#1d6b4c;--d-ho:#cf3b2d;--d-ho-bg:#f8e3e0;--d-ho-tx:#b1241c;--d-tr:#6d4ec7;--d-tr-bg:#ece8fb;--d-tr-tx:#4a32a0;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 80px;}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;}
.hd{max-width:1320px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:9px;}.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
.brand h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px;margin:0;}.brand .yr{color:var(--gold);font-size:13px;}
.brand .brandlogo{height:26px;width:auto;align-self:center;}.lbrand .lbrandlogo{height:34px;width:auto;align-self:center;}
.hdright{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.toggle{display:flex;border:1px solid var(--gold);border-radius:8px;overflow:hidden;}
.toggle button{background:transparent;color:var(--gold);border:0;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.toggle button.on{background:var(--gold);color:var(--navy);font-weight:500;}
.userbar{display:flex;align-items:center;gap:10px;font-size:12px;color:#cdd3e6;}
.userbar .uname{color:#fff;}.userbar .mgr{background:var(--gold);color:var(--navy);font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500;}
.userbar .ubtn{background:transparent;border:1px solid #3a4a7a;color:#cdd3e6;border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit;}
.userbar .ubtn:hover{border-color:var(--gold);color:var(--gold);}
.hide{display:none!important;}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 12px;flex-wrap:wrap;}
.navg{display:flex;align-items:center;gap:8px;}
.navg button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--navy);font-family:inherit;}
.navg button:hover{border-color:var(--navy);}
.navg .mtitle{font-family:"Noto Serif TC",serif;font-size:20px;color:var(--navy);font-weight:600;min-width:150px;text-align:center;}
.navg .todaybtn{width:auto;padding:0 12px;font-size:12px;}
.dfilter{display:flex;gap:6px;flex-wrap:wrap;}
.dpill{font-size:12px;padding:5px 11px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.dpill:hover{border-color:var(--navy);}.dpill.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:500;}
.dlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center;}
.dlegend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;}
.dow-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.dow-head div{text-align:center;font-size:12px;color:var(--muted);font-weight:500;padding:2px 0;}.dow-head div.we{color:var(--d-ho);}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;}
.day.spill{background:#fafbfc;cursor:default;}.day.today{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
.dnum{font-size:13px;color:var(--ink);font-weight:600;display:flex;align-items:baseline;gap:6px;font-family:"Noto Serif TC",serif;}
.day.spill .dnum{color:var(--hint);}.dnum .dow{display:none;font-size:11px;color:var(--muted);font-weight:400;}
.dnum .tdot{margin-left:auto;font-size:10px;color:#fff;background:var(--navy);border-radius:10px;padding:0 6px;font-family:"Noto Sans TC";}
.dnum .pls{margin-left:auto;color:var(--gold);font-weight:700;font-size:15px;}
.devs{display:flex;flex-direction:column;gap:3px;}
.ev{font-size:11px;padding:2px 6px;border-radius:5px;border-left:3px solid;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev.eall{background:var(--d-all-bg);color:var(--d-all-tx);border-color:var(--d-all);}.ev.ees{background:var(--d-es-bg);color:var(--d-es-tx);border-color:var(--d-es);}
.ev.ejh{background:var(--d-jh-bg);color:var(--d-jh-tx);border-color:var(--d-jh);}.ev.ehs{background:var(--d-hs-bg);color:var(--d-hs-tx);border-color:var(--d-hs);}.ev.eho{background:var(--d-ho-bg);color:var(--d-ho-tx);border-color:var(--d-ho);}.ev.etr{background:var(--d-tr-bg);color:var(--d-tr-tx);border-color:var(--d-tr);}.filtcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}.dfilter2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end;}.dfilter2 .l2lbl{font-size:12px;color:var(--hint);margin-right:2px;}.dpill.l2{border-style:dashed;}.dpill.l2.on{background:var(--navy-soft);color:#fff;border-color:var(--navy-soft);}.evinfo{font-size:12px;color:var(--muted);margin-top:1px;}.evcatrow{margin-top:5px;}.catsel{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-family:inherit;}.evcat{font-size:11px;background:#eef0f6;color:var(--navy-soft);padding:1px 7px;border-radius:10px;}.trchk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--navy);margin:8px 0;cursor:pointer;}.catwrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:6px 0;}.catwrap select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;}
.emptymsg{grid-column:1/-1;text-align:center;color:var(--hint);font-size:13px;padding:30px;}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 17px;min-width:115px;}
.stat .n{font-size:23px;font-weight:700;color:var(--navy);font-family:"Noto Serif TC",serif;}.stat .l{font-size:12px;color:var(--muted);}
.ctrl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:14px;}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center;}.pillrow:last-child{margin-bottom:0;}
.pillrow .lbl{font-size:12px;color:var(--muted);margin-right:4px;min-width:34px;}
.pillrow .yrlbl{font-size:11px;color:var(--gold-soft);background:var(--navy);padding:2px 8px;border-radius:6px;margin:0 2px;}
.pill{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.pill:hover{border-color:var(--navy);color:var(--navy);}.pill.on{background:var(--navy);color:var(--gold);border-color:var(--navy);font-weight:500;}
.pill.mon.on{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.status{font-size:12px;color:var(--navy-soft);margin-top:4px;}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.filters label{font-size:12px;color:var(--muted);}
.filters select,.filters input{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
.filters input{min-width:190px;}.filters .clr{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center;}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;}
.gtools{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
.gtools button{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.gtools button:hover{border-color:var(--navy);color:var(--navy);}.gtools .gt-hint{font-size:12px;color:var(--hint);}
.gtools .addbtn{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:500;}
.gantt{background:var(--card);border:1px solid var(--line);border-radius:14px;}
.grow{display:grid;grid-template-columns:210px repeat(12,minmax(46px,1fr));align-items:stretch;}
.ghead{background:var(--navy-tint);position:sticky;top:var(--ghtop);z-index:35;}
.ghead .gc{font-size:12px;color:var(--navy);text-align:center;padding:6px 0;font-weight:500;border-left:1px solid var(--line-soft);cursor:pointer;line-height:1.15;}
.ghead .gc .yy{display:block;font-size:9px;color:var(--hint);font-weight:400;}
.ghead .gc:hover{background:#dfe3f0;}.ghead .gc.cur{background:var(--navy);color:var(--gold);}.ghead .gc.cur .yy{color:var(--gold-soft);}
.ghead .glabel{padding:9px 12px;color:var(--muted);font-weight:500;text-align:left;cursor:default;}
.gc.yb,.cell.yb{border-left:2px solid var(--gold)!important;}
.unit-h{grid-column:1/-1;background:var(--navy);color:#fff;padding:8px 13px;font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.unit-h .cnt{font-size:11px;color:var(--gold-soft);font-weight:400;}.unit-h .chev{transition:.2s;display:inline-block;}.unit-h.collapsed .chev{transform:rotate(-90deg);}
.arow .alabel{padding:8px 11px 8px 13px;border-top:1px solid var(--line-soft);cursor:pointer;display:flex;align-items:center;gap:6px;background:#fff;}
.arow:hover .alabel{background:#fafbff;}.arow .alabel .nm{font-size:13px;line-height:1.35;}.arow .alabel .edot{color:var(--gold);font-size:11px;}
.cell{border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft);position:relative;min-height:34px;display:flex;align-items:center;justify-content:center;}
.cell.cur{background:#fbfaf2;}
.bar{position:absolute;left:3px;right:3px;height:16px;border-radius:4px;}
.bar.plan{background:var(--plan);}.bar.design{background:var(--design);}.bar.exec{background:var(--exec);}.bar.after{background:var(--after);}
.star{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--exec-tx);z-index:2;}
.miss{padding:14px;color:var(--hint);font-size:13px;}
.scrim{position:fixed;inset:0;background:rgba(20,28,55,.4);opacity:0;pointer-events:none;transition:.2s;z-index:60;}.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:-560px;width:480px;max-width:94vw;height:100%;background:#fff;z-index:70;transition:.25s;overflow-y:auto;box-shadow:-4px 0 24px rgba(20,28,55,.18);}.drawer.on{right:0;}
.dhd{background:var(--navy);color:#fff;padding:16px 18px;}.dhd h3{margin:0;font-size:17px;font-family:"Noto Serif TC",serif;}.dhd .dmeta{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}.dhd .dmeta .badge{background:rgba(255,255,255,.14);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;}
.dhd .dedit{background:var(--gold);color:var(--navy);border:0;border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;margin-left:auto;}
.dhd .ddel{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
.dclose{position:absolute;top:14px;right:14px;background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;}
.dbody{padding:16px 18px;}
.mblock{display:flex;gap:11px;padding:8px 0;border-top:1px solid var(--line-soft);}
.mblock .mo{flex:0 0 60px;font-weight:700;color:var(--navy);font-size:13px;font-family:"Noto Serif TC",serif;display:flex;flex-direction:column;gap:2px;}
.mblock .mo .yy{font-size:9px;color:var(--hint);font-weight:400;}.mblock .mo .pp{font-size:10px;font-weight:500;padding:1px 6px;border-radius:4px;}
.mblock .tasks{flex:1;font-size:13px;}.mblock .tasks div{padding:1px 0;}
.evrow{padding:8px 0;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:flex-start;}.evtag{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-top:1px;}
.evrow .exdel{margin-left:auto;background:transparent;border:0;color:var(--d-ho);font-size:16px;cursor:pointer;line-height:1;}
.pp.plan{background:var(--plan-bg);color:var(--plan-tx);}.pp.design{background:var(--design-bg);color:var(--design-tx);}.pp.exec{background:var(--exec-bg);color:var(--exec-tx);}.pp.after{background:var(--after-bg);color:var(--after-tx);}
.addev{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
.addev h4{margin:0 0 8px;font-size:13px;color:var(--navy);}
.addev input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;}
.addev .divs{display:flex;gap:12px;flex-wrap:wrap;margin:9px 0;font-size:12px;color:var(--muted);}
.addev .divs label{display:flex;align-items:center;gap:4px;cursor:pointer;}
.addev .addbtn2{margin-top:4px;width:100%;padding:9px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-size:13px;cursor:pointer;font-family:inherit;}
footer{margin-top:26px;font-size:12px;color:var(--hint);text-align:center;}
/* save bar */
#saveBar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:var(--navy);color:#fff;border-radius:30px;padding:9px 12px 9px 18px;display:none;align-items:center;gap:14px;box-shadow:0 8px 28px rgba(20,28,55,.35);}
#saveBar.on{display:flex;}#saveBar .sdot{color:var(--gold-soft);font-size:13px;}
#saveBar button{background:var(--gold);color:var(--navy);border:0;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
#saveBar button:disabled{opacity:.6;}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:130;background:#222;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;}#toast.on{opacity:.95;}#toast.err{background:#b1241c;}
/* gate */
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#27345f 0%,#1a2756 55%,#141d40 100%);transition:opacity .5s ease;font-family:"Noto Sans TC",system-ui,sans-serif;}
#gate.out{opacity:0;pointer-events:none;}
.lcard{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:370px;margin:16px;box-shadow:0 18px 50px rgba(0,0,0,.28);}
.lbrand{display:flex;align-items:baseline;gap:9px;justify-content:center;margin-bottom:4px;}.lbrand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
.lbrand h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:21px;margin:0;color:var(--navy);}
.lsub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;}
.lcard label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
.lcard input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
.lcard input:focus{outline:2px solid var(--gold);border-color:var(--gold);}
.lbtn{width:100%;margin-top:22px;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;}
.lbtn:hover{background:#27345f;}.lbtn:disabled{opacity:.6;cursor:default;}
.lerr{color:#cf3b2d;font-size:13px;margin-top:12px;min-height:18px;text-align:center;}
.lhint{color:#9aa1ad;font-size:12px;margin-top:16px;text-align:center;line-height:1.6;}
.lcard.shake{animation:lshake .4s;}@keyframes lshake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
.welcome{text-align:center;color:#fff;display:none;}
.mascot-wrap{height:170px;display:flex;align-items:flex-end;justify-content:center;}
.mascot{height:128px;transform-origin:bottom center;animation:commaJump .82s ease-in-out infinite;}
@keyframes commaJump{0%{transform:translateY(0) scale(1,1);}18%{transform:translateY(0) scale(1.1,.88);}45%{transform:translateY(-58px) scale(.95,1.08);}60%{transform:translateY(-58px) scale(1,1);}82%{transform:translateY(0) scale(1.08,.92);}100%{transform:translateY(0) scale(1,1);}}
.mshadow{width:70px;height:12px;border-radius:50%;background:rgba(0,0,0,.3);margin:6px auto 0;animation:mshadow .82s ease-in-out infinite;}
@keyframes mshadow{0%,100%{transform:scale(1);opacity:.4;}50%{transform:scale(.55);opacity:.18;}}
.welcomeTxt{font-family:"Noto Serif TC",serif;font-size:25px;font-weight:700;margin-top:16px;animation:fadeUp .45s ease .1s both;}.welcomeTxt span{color:var(--gold-soft);}
.welcomeSub{color:#aeb6d2;font-size:13px;margin-top:8px;animation:fadeUp .45s ease .25s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
/* modal (pw + editor) */
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(20,28,55,.5);}
.modal.on{display:flex;}
.mcard{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px;margin:16px;box-shadow:0 18px 50px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;}
.mcard.wide{max-width:560px;}
.mcard h3{margin:0 0 4px;font-family:"Noto Serif TC",serif;color:var(--navy);font-size:18px;}
.mcard .psub{color:var(--muted);font-size:12px;margin-bottom:14px;}
.mcard label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;}
.mcard input[type=text],.mcard input[type=password],.mcard select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;}
.mcard input:focus,.mcard select:focus{outline:2px solid var(--gold);border-color:var(--gold);}
.pwmsg{font-size:13px;margin-top:10px;min-height:18px;text-align:center;}
.mrow{display:flex;gap:10px;margin-top:18px;}
.mrow button{flex:1;padding:11px;border-radius:9px;font-size:14px;cursor:pointer;font-family:inherit;border:1px solid var(--line);}
.mrow .cancel{background:#fff;color:var(--muted);}.mrow .ok{background:var(--navy);color:#fff;border:0;}.mrow .del{background:#fff;color:var(--d-ho);border-color:#f0c9c4;flex:0 0 auto;padding:11px 14px;}
.eslot{display:grid;grid-template-columns:62px 92px 1fr 38px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line-soft);}
.eslot .el{font-size:12px;color:var(--navy);font-weight:500;}.eslot .el .yy{color:var(--hint);font-weight:400;font-size:10px;}
.eslot select,.eslot input{padding:6px 7px!important;font-size:12px!important;}
.eslot .stbox{text-align:center;}.eslothead{display:grid;grid-template-columns:62px 92px 1fr 38px;gap:8px;font-size:11px;color:var(--muted);margin-top:10px;padding-bottom:2px;}
@media(max-width:680px){
  .calgrid{grid-template-columns:1fr;gap:6px;}.dow-head{display:none;}

  btn.disabled=true;btn.textContent='儲存中…';
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveData',email:email,activities:ACTS,dayevents:DAYS})});
    const d=await res.json();
    if(d.ok){dirty=false;updateSaveBar();toast('已儲存到雲端，其他人重新整理即可看到');}
    else toast(d.msg||'儲存失敗',true);
  }catch(e){toast('連線失敗，請稍後再試',true);}
  finally{btn.disabled=false;btn.textContent='儲存到雲端';}
}
/* ===== 登入 / 改密碼 / 登出 ===== */
function getEmail(){try{return sessionStorage.getItem('commaCalendarUser')||'';}catch(e){return'';}}
function nameFromEmail(em){return (em||'').split('@')[0];}
function setManager(){const em=getEmail().toLowerCase();isManager=MANAGERS.includes(em);}
function showUser(){const u=getEmail();if(u)document.getElementById('uname').textContent=u;}
function catOf(t){if(/競賽|盃|AMC|IMC|JHMC/.test(t))return '競賽';if(/造勢|名人堂|記者會|媒體|聯訪/.test(t))return '公關活動';if(/營隊|戰逗營|典禮|畢業|旅行|茶會|運動會|誓師|迎新|說明會|家說會|參訪|遊學|出遊/.test(t))return '活動';return '';}
const TRAIN=[['2026-7','22','OKR','全體・管理職能・13:00–17:00',['全體']],['2026-8','24','OKR','全體・管理職能・13:00–17:00',['全體']],['2026-9','1','啟動大會','全體・核心職能・09:30–12:00',['全體']],['2026-9','15','銷售異議處理','國小・核心職能・09:00–12:00',['國小']],['2026-9','17','銷售異議處理','國中＋高中・核心職能・09:00–12:00',['國中','高中']],['2026-10','2','主管策略營','行政（主管）・管理職能・暫定',[]],['2026-10','6','點新星計畫','全體・通識職能・09:00–13:00',['全體']],['2026-11','3','固定每月教培日','暫定',[]],['2026-12','8','固定每月教培日（建議安排周年慶內容）','暫定',[]],['2027-1','12','固定每月教培日','暫定',[]]];
function normalizeDays(){
  for(const k in DAYS){for(const d in DAYS[k]){(DAYS[k][d]||[]).forEach(e=>{if(e.kind!=='教培'&&!isFest(e.text)&&(e.cat===undefined||e.cat===null)){const c=catOf(e.text);if(c)e.cat=c;}});}}
  const rm=(k,d,sub)=>{if(DAYS[k]&&DAYS[k][d])DAYS[k][d]=DAYS[k][d].filter(e=>!(e.kind!=='教培'&&e.text.indexOf(sub)>=0));};
  rm('2026-7','22','OKR課程');rm('2026-8','24','OKR課程');rm('2026-9','1','全體夥伴大教培');
  TRAIN.forEach(a=>{const k=a[0],d=a[1],text=a[2],info=a[3],divs=a[4];DAYS[k]=DAYS[k]||{};DAYS[k][d]=DAYS[k][d]||[];if(!DAYS[k][d].some(e=>e.kind==='教培'&&e.text===text))DAYS[k][d].unshift({text:text,divs:divs,kind:'教培',info:info});});
}
async function enterApp(){setManager();document.getElementById('welcomeSub').textContent='正在載入最新資料…';await loadData();normalizeDays();showUser();render();}
window.doLogin=async function(){
  const email=document.getElementById('lemail').value.trim(),pw=document.getElementById('lpw').value.trim();
  const err=document.getElementById('lerr'),btn=document.getElementById('loginBtn'),card=document.getElementById('loginCard');
  if(!email||!pw){err.textContent="請輸入帳號與密碼。";return;}
  err.textContent="";btn.disabled=true;btn.textContent="登入中…";
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({email:email,password:pw})});
    const data=await res.json();
    if(data.ok){
      try{sessionStorage.setItem('commaCalendarUser',data.email||email);}catch(e){}
      document.getElementById('wname').textContent=data.name||data.displayName||nameFromEmail(data.email||email);
      document.getElementById('loginCard').style.display='none';document.getElementById('welcome').style.display='block';
      await enterApp();
      setTimeout(()=>{const g=document.getElementById('gate');g.classList.add('out');setTimeout(()=>g.style.display='none',520);},950);
    }else{card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
      err.textContent=data.msg==="密碼錯誤"?"密碼錯誤（提示：預設密碼為 0000）。":data.msg==="帳號不存在"?"帳號不存在，請確認信箱是否正確。":"登入失敗，請再試一次。";}
  }catch(e){err.textContent="無法連線到驗證伺服器，請檢查網路後再試。";}
  finally{btn.disabled=false;btn.textContent="登入";}
};
document.getElementById('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('lemail').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lpw').focus();});
window.logout=function(){if(dirty&&!confirm('有未儲存的變更，確定要登出嗎？'))return;try{sessionStorage.removeItem('commaCalendarUser');}catch(e){}location.reload();};
window.openPw=function(){document.getElementById('pwwho').textContent='帳號：'+getEmail();['pwOld','pwNew','pwNew2'].forEach(i=>document.getElementById(i).value='');document.getElementById('pwmsg').textContent='';document.getElementById('pwModal').classList.add('on');};
window.closePw=function(){document.getElementById('pwModal').classList.remove('on');};
window.doChangePw=async function(){
  const email=getEmail();const oldp=document.getElementById('pwOld').value.trim(),np=document.getElementById('pwNew').value.trim(),np2=document.getElementById('pwNew2').value.trim();
  const msg=document.getElementById('pwmsg'),btn=document.getElementById('pwBtn');msg.style.color='#cf3b2d';
  if(!oldp||!np||!np2){msg.textContent="請完整填寫三個欄位。";return;}
  if(np!==np2){msg.textContent="兩次新密碼不一致。";return;}
  if(np.length<4){msg.textContent="新密碼至少 4 碼。";return;}
  btn.disabled=true;btn.textContent="處理中…";
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"changePassword",email:email,oldPassword:oldp,newPassword:np})});
    const data=await res.json();
    if(data.ok){msg.style.color='#1d6b4c';msg.textContent="密碼已更新！下次請用新密碼登入。";setTimeout(closePw,1400);}
    else msg.textContent=data.msg||"更新失敗，請確認目前密碼是否正確。";
  }catch(e){msg.textContent="無法連線到伺服器，請稍後再試。";}
  finally{btn.disabled=false;btn.textContent="送出";}
};
[['pwModal',closePw],['actModal',closeActEditor]].forEach(([id,fn])=>document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)fn();}));
window.addEventListener('beforeunload',e=>{if(isManager&&dirty){e.preventDefault();e.returnValue='';}});
// 初始
(function(){try{if(getEmail()){document.getElementById('gate').style.display='none';enterApp();return;}}catch(e){}render();})();
</script></body></html>
