<title>逗點教室・年度行事曆大表 2026/6–2027/6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2756;--navy-soft:#27345f;--gold:#c9a227;--gold-soft:#e3c463;--ink:#1f2430;--muted:#6b7280;--hint:#9aa1ad;--line:#e6e8ef;--line-soft:#f0f1f6;--bg:#f6f7fb;--card:#fff;--navy-tint:#eef0f6;
--plan:#85B7EB;--plan-bg:#E6F1FB;--plan-tx:#0c447c;--design:#EF9F27;--design-bg:#FAEEDA;--design-tx:#633806;--exec:#F0997B;--exec-bg:#FAECE7;--exec-tx:#993c1d;--after:#5DCAA5;--after-bg:#E1F5EE;--after-tx:#0F6E56;
--d-all:#707888;--d-all-bg:#eceef2;--d-all-tx:#3d4452;--d-es:#c9a227;--d-es-bg:#f9f1d3;--d-es-tx:#876613;--d-jh:#1a2756;--d-jh-bg:#e4e7f1;--d-jh-tx:#1a2756;--d-hs:#2f9268;--d-hs-bg:#e0f0e8;--d-hs-tx:#1d6b4c;--d-ho:#cf3b2d;--d-ho-bg:#f8e3e0;--d-ho-tx:#b1241c;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 60px;}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;}
.hd{max-width:1320px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:9px;}.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
.brand h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px;margin:0;}.brand .yr{color:var(--gold);font-size:13px;}
.hd .sub{color:#aeb6d2;font-size:12px;margin-top:2px;}
.toggle{display:flex;border:1px solid var(--gold);border-radius:8px;overflow:hidden;}
.toggle button{background:transparent;color:var(--gold);border:0;padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit;}
.toggle button.on{background:var(--gold);color:var(--navy);font-weight:500;}
.hide{display:none!important;}
/* calendar */
.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 12px;flex-wrap:wrap;}
.navg{display:flex;align-items:center;gap:8px;}
.navg button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--navy);font-family:inherit;}
.navg button:hover{border-color:var(--navy);}
.navg .mtitle{font-family:"Noto Serif TC",serif;font-size:20px;color:var(--navy);font-weight:600;min-width:150px;text-align:center;}
.navg .todaybtn{width:auto;padding:0 12px;font-size:12px;}
.dfilter{display:flex;gap:6px;flex-wrap:wrap;}
.dpill{font-size:12px;padding:5px 11px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.dpill:hover{border-color:var(--navy);}.dpill.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:500;}
.dlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center;}
.dlegend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;}
.dow-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.dow-head div{text-align:center;font-size:12px;color:var(--muted);font-weight:500;padding:2px 0;}
.dow-head div.we{color:var(--d-ho);}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;}
.day.spill{background:#fafbfc;}.day.today{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
.dnum{font-size:13px;color:var(--ink);font-weight:600;display:flex;align-items:baseline;gap:6px;font-family:"Noto Serif TC",serif;}
.day.spill .dnum{color:var(--hint);}.dnum .dow{display:none;font-size:11px;color:var(--muted);font-weight:400;}
.dnum .tdot{margin-left:auto;font-size:10px;color:#fff;background:var(--navy);border-radius:10px;padding:0 6px;font-family:"Noto Sans TC";}
.devs{display:flex;flex-direction:column;gap:3px;}
.ev{font-size:11px;padding:2px 6px;border-radius:5px;border-left:3px solid;cursor:pointer;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev.eall{background:var(--d-all-bg);color:var(--d-all-tx);border-color:var(--d-all);}
.ev.ees{background:var(--d-es-bg);color:var(--d-es-tx);border-color:var(--d-es);}
.ev.ejh{background:var(--d-jh-bg);color:var(--d-jh-tx);border-color:var(--d-jh);}
.ev.ehs{background:var(--d-hs-bg);color:var(--d-hs-tx);border-color:var(--d-hs);}
.ev.eho{background:var(--d-ho-bg);color:var(--d-ho-tx);border-color:var(--d-ho);}
.emptymsg{grid-column:1/-1;text-align:center;color:var(--hint);font-size:13px;padding:30px;}
/* controls (gantt/list) */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 17px;min-width:115px;}
.stat .n{font-size:23px;font-weight:700;color:var(--navy);font-family:"Noto Serif TC",serif;}.stat .l{font-size:12px;color:var(--muted);}
.ctrl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:14px;}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center;}.pillrow:last-child{margin-bottom:0;}
.pillrow .lbl{font-size:12px;color:var(--muted);margin-right:4px;min-width:34px;}
.pillrow .yrlbl{font-size:11px;color:var(--gold-soft);background:var(--navy);padding:2px 8px;border-radius:6px;margin:0 2px;}
.pill{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.pill:hover{border-color:var(--navy);color:var(--navy);}.pill.on{background:var(--navy);color:var(--gold);border-color:var(--navy);font-weight:500;}
.pill.mon.on{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.status{font-size:12px;color:var(--navy-soft);margin-top:4px;}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.filters label{font-size:12px;color:var(--muted);}
.filters select,.filters input{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
.filters input{min-width:190px;}
.filters .clr{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center;}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;}
.gtools{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.gtools button{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.gtools button:hover{border-color:var(--navy);color:var(--navy);}.gtools .gt-hint{font-size:12px;color:var(--hint);}
.gantt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.gscroll{overflow-x:auto;}
.grow{display:grid;grid-template-columns:210px repeat(13,minmax(46px,1fr));align-items:stretch;}
.ghead{background:var(--navy-tint);}
.ghead .gc{font-size:12px;color:var(--navy);text-align:center;padding:6px 0;font-weight:500;border-left:1px solid var(--line-soft);cursor:pointer;line-height:1.15;}
.ghead .gc .yy{display:block;font-size:9px;color:var(--hint);font-weight:400;}
.ghead .gc:hover{background:#dfe3f0;}.ghead .gc.cur{background:var(--navy);color:var(--gold);}.ghead .gc.cur .yy{color:var(--gold-soft);}
.ghead .glabel{padding:9px 12px;color:var(--muted);font-weight:500;text-align:left;cursor:default;}
.gc.yb,.cell.yb{border-left:2px solid var(--gold)!important;}
.unit-h{grid-column:1/-1;background:var(--navy);color:#fff;padding:8px 13px;font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.unit-h .cnt{font-size:11px;color:var(--gold-soft);font-weight:400;}.unit-h .chev{transition:.2s;display:inline-block;}.unit-h.collapsed .chev{transform:rotate(-90deg);}
.axis-h{grid-column:1/-1;background:#fafbff;color:var(--navy-soft);padding:5px 13px 5px 22px;font-size:12px;font-weight:500;border-top:1px solid var(--line-soft);}
.arow .alabel{padding:8px 11px 8px 13px;border-top:1px solid var(--line-soft);cursor:pointer;display:flex;flex-direction:column;gap:3px;background:#fff;}
.arow:hover .alabel{background:#fafbff;}.arow .alabel .nm{font-size:13px;line-height:1.35;}.arow .alabel .meta{display:flex;gap:5px;flex-wrap:wrap;}
.badge{font-size:10px;padding:1px 6px;border-radius:4px;line-height:1.5;}.b-src{background:#eef0f6;color:var(--navy-soft);}.b-jz{background:#f3f1fb;color:#3c3489;}
.cell{border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft);position:relative;min-height:34px;display:flex;align-items:center;justify-content:center;}
.cell.cur{background:#fbfaf2;}
.bar{position:absolute;left:3px;right:3px;height:16px;border-radius:4px;}
.bar.plan{background:var(--plan);}.bar.design{background:var(--design);}.bar.exec{background:var(--exec);}.bar.after{background:var(--after);}
.star{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--exec-tx);z-index:2;}
.listv{display:none;}.listv.on{display:block;}
.litem{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer;}
.litem:hover{border-color:var(--navy);}.litem .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.litem .mini{display:flex;gap:2px;margin-top:8px;}.litem .mc{flex:1;height:6px;border-radius:2px;background:var(--line-soft);}
.litem .mc.plan{background:var(--plan);}.litem .mc.design{background:var(--design);}.litem .mc.exec{background:var(--exec);}.litem .mc.after{background:var(--after);}
.lgroup{margin-bottom:8px;}
.miss{padding:14px;color:var(--hint);font-size:13px;}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,28,55,.4);opacity:0;pointer-events:none;transition:.2s;z-index:60;}.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:-520px;width:480px;max-width:92vw;height:100%;background:#fff;z-index:70;transition:.25s;overflow-y:auto;box-shadow:-4px 0 24px rgba(20,28,55,.18);}.drawer.on{right:0;}
.dhd{background:var(--navy);color:#fff;padding:16px 18px;}.dhd h3{margin:0;font-size:17px;font-family:"Noto Serif TC",serif;}.dhd .dmeta{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;}.dhd .dmeta .badge{background:rgba(255,255,255,.14);color:#fff;}
.dclose{position:absolute;top:14px;right:14px;background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;}
.dbody{padding:16px 18px;}
.mblock{display:flex;gap:11px;padding:8px 0;border-top:1px solid var(--line-soft);}
.mblock .mo{flex:0 0 60px;font-weight:700;color:var(--navy);font-size:13px;font-family:"Noto Serif TC",serif;display:flex;flex-direction:column;gap:2px;}
.mblock .mo .yy{font-size:9px;color:var(--hint);font-weight:400;}.mblock .mo .pp{font-size:10px;font-weight:500;padding:1px 6px;border-radius:4px;}
.mblock .tasks{flex:1;font-size:13px;}.mblock .tasks div{padding:1px 0;}
.evrow{padding:8px 0;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:flex-start;}.evtag{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-top:1px;}
.pp.plan{background:var(--plan-bg);color:var(--plan-tx);}.pp.design{background:var(--design-bg);color:var(--design-tx);}.pp.exec{background:var(--exec-bg);color:var(--exec-tx);}.pp.after{background:var(--after-bg);color:var(--after-tx);}
footer{margin-top:26px;font-size:12px;color:var(--hint);text-align:center;}
@media(max-width:680px){
  .calgrid{grid-template-columns:1fr;gap:6px;}.dow-head{display:none;}
  .day{flex-direction:row;align-items:flex-start;min-height:auto;padding:8px 10px;gap:10px;}
  .day.spill,.day.empty{display:none;}
  .day .dnum{flex-direction:column;align-items:flex-start;gap:1px;min-width:46px;flex:0 0 46px;}.day .dnum .dow{display:block;}.day .devs{flex:1;}
  .grow{grid-template-columns:120px repeat(13,minmax(30px,1fr));}.drawer{width:100%;}.navg .mtitle{font-size:18px;min-width:120px;}
}
</style></head><body>

</div>

  document.getElementById('mtitle').textContent=calYear+'年'+calMonth+'月';renderFilter();
  const md=DAY[calYear+'-'+calMonth]||{};
  const startDow=new Date(calYear,calMonth-1,1).getDay(),dim=new Date(calYear,calMonth,0).getDate(),prevDim=new Date(calYear,calMonth-1,0).getDate();
  let cells=[];for(let i=0;i<startDow;i++)cells.push({spill:1,n:prevDim-startDow+1+i});for(let d=1;d<=dim;d++)cells.push({n:d});while(cells.length%7!==0)cells.push({spill:1,n:cells.length-(startDow+dim)+1});
  let h='',any=false;
  cells.forEach(c=>{if(c.spill){h+=`<div class="day spill"><div class="dnum">${c.n}</div></div>`;return;}
    const evs=(md[String(c.n)]||[]).filter(evMatch);if(evs.length)any=true;
    const today=(calYear===TY&&calMonth===TM&&c.n===TD),dow=DOW[new Date(calYear,calMonth-1,c.n).getDay()];
    h+=`<div class="day${today?' today':''}${evs.length?'':' empty'}"><div class="dnum"><span class="dow">週${dow}</span>${c.n}${today?'<span class="tdot">今天</span>':''}</div><div class="devs">`;
    evs.forEach(e=>{h+=`<div class="ev ${evCls(e)}" onclick="openDay(${calYear},${calMonth},${c.n})" title="${e.text}">${e.text}</div>`;});
    h+='</div></div>';});
  if(!any&&Object.keys(md).length===0)h+=`<div class="emptymsg">${calYear}年${calMonth}月 目前沒有逐日資料。</div>`;
  document.getElementById('calgrid').innerHTML=h;
}
function openDay(y,m,d){const evs=(DAY[y+'-'+m]||{})[String(d)]||[];const dow=DOW[new Date(y,m-1,d).getDay()];
  let body=evs.map(e=>{const tags=e.divs.join('・')||'—';return `<div class="evrow"><span class="evtag ev ${evCls(e)}" style="border:0">${isFest(e.text)?'節日':tags}</span><div>${e.text}</div></div>`;}).join('')||'<div style="color:var(--hint)">當日無事件</div>';
  document.getElementById('drawer').innerHTML=`<div class="dhd"><button class="dclose" onclick="closeDrawer()">×</button><h3>${m}月${d}日（週${dow}）</h3><div class="dmeta"><span class="badge">${y}年</span></div></div><div class="dbody">${body}</div>`;
  document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on');}
/* ====== 甘特／清單 ====== */
let selKey=null, selUnit=null;
const collapsed={}; ACT.unitOrder.forEach(u=>collapsed[u]=true);
function mData(a,y,m){return (y===2026?a.m2026:a.m2027)[m];}
function mEvent(a,y,m){return (y===2026?a.ev2026:a.ev2027).includes(m);}
function hasAny(a){return FISCAL.some(([y,m])=>mData(a,y,m));}
function axesFor(unit){const order=['招生戰線','活動企劃','規劃事項','行銷節奏'];const s=new Set(ACT.activities.filter(a=>!unit||a.unit===unit).map(a=>a.axis));return order.filter(x=>s.has(x));}
function syncAxis(){const cur=fAxis.value;const ax=axesFor(selUnit);fAxis.innerHTML='<option value="">全部主軸</option>'+ax.map(x=>'<option>'+x+'</option>').join('');fAxis.value=(cur&&ax.includes(cur))?cur:'';}
function clearAll(){selKey=null;selUnit=null;fAxis.value='';document.getElementById('fSearch').value='';render();}
function getF(){return{unit:selUnit,axis:fAxis.value,q:document.getElementById('fSearch').value.trim().toLowerCase()};}
function matchA(a,f){if(f.unit&&a.unit!==f.unit)return false;if(f.axis&&a.axis!==f.axis)return false;if(f.q){let hay=a.name+' '+a.unit+' '+a.axis;FISCAL.forEach(([y,m])=>{const c=mData(a,y,m);if(c)hay+=' '+c.ops.join(' ');});if(!hay.toLowerCase().includes(f.q))return false;}return true;}
function filtered(){const f=getF();return ACT.activities.filter(a=>matchA(a,f)&&hasAny(a));}
function toggleSlot(k){selKey=(selKey===k)?null:k;render();}
function toggleUnit(u){selUnit=(selUnit===u)?null:u;syncAxis();render();}
function toggleCollapse(u){collapsed[u]=!collapsed[u];renderGantt();}
function expandAll(o){ACT.unitOrder.forEach(u=>collapsed[u]=!o);renderGantt();}
function renderControls(){
  let mp='<span class="lbl">月份</span>';
  FISCAL.forEach(([y,m],i)=>{if(i===0)mp+='<span class="yrlbl">2026</span>';if(y===2027&&FISCAL[i-1][0]===2026)mp+='<span class="yrlbl">2027</span>';const k=y+'-'+m;mp+=`<button class="pill mon${selKey===k?' on':''}" onclick="toggleSlot('${k}')">${m}月</button>`;});
  document.getElementById('monthPills').innerHTML=mp;
  document.getElementById('unitPills').innerHTML='<span class="lbl">單位</span>'+ACT.unitOrder.map(u=>`<button class="pill${u===selUnit?' on':''}" onclick="toggleUnit('${u}')">${u}</button>`).join('');
  let st='目前顯示：'+(selUnit||'全部單位')+'　／　';
  if(selKey){const[y,m]=selKey.split('-');st+=m+'月('+y+')';}else st+='全部月份';
  document.getElementById('status').textContent=st;
}
function renderStats(){const acts=filtered();let tm=acts.length;
  if(selKey){const[y,m]=selKey.split('-').map(Number);tm=acts.filter(a=>mData(a,y,m)).length;}
  document.getElementById('stats').innerHTML=`<div class="stat"><div class="n">${acts.length}</div><div class="l">活動（目前篩選）</div></div><div class="stat"><div class="n">${tm}</div><div class="l">${selKey?selKey.split('-')[1]+'月有任務':'全年活動'}</div></div><div class="stat"><div class="n">${ACT.unitOrder.length}</div><div class="l">負責單位</div></div>`;}
function groupByUnit(acts){const g={};acts.forEach(a=>{(g[a.unit]=g[a.unit]||[]).push(a);});return ACT.unitOrder.filter(u=>g[u]).map(u=>[u,g[u]]);}
function cellHTML(a,y,m,i){const c=mData(a,y,m);const k=y+'-'+m;const cur=(selKey===k)?' cur':'';const yb=(y===2027&&m===1)?' yb':'';
  if(!c)return `<div class="cell${cur}${yb}"></div>`;const star=mEvent(a,y,m)?'<span class="star">★</span>':'';
  return `<div class="cell${cur}${yb}" title="${m}月(${y}) ${PHASE[c.phase]}：${c.ops.join('；').replace(/"/g,'')}">${star}<span class="bar ${c.phase}"></span></div>`;}
function renderGantt(){
  const acts=filtered();
  let h='<div class="grow ghead"><div class="gc glabel">活動 / 負責單位</div>';
  FISCAL.forEach(([y,m])=>{const k=y+'-'+m;const yb=(y===2027&&m===1)?' yb':'';h+=`<div class="gc${selKey===k?' cur':''}${yb}" onclick="toggleSlot('${k}')">${m}<span class="yy">${y}</span></div>`;});
  h+='</div>';
  const groups=groupByUnit(acts);
  if(!groups.length)h+='<div class="miss">沒有符合條件的活動。</div>';
  groups.forEach(([unit,list])=>{const col=(selUnit?false:collapsed[unit]);
    h+=`<div class="grow"><div class="unit-h${col?' collapsed':''}" onclick="toggleCollapse('${unit}')"><span><span class="chev">▾</span> ${unit}</span><span class="cnt">${list.length} 項</span></div></div>`;
    if(col)return;
    const byAx={};list.forEach(a=>{(byAx[a.axis]=byAx[a.axis]||[]).push(a);});
    Object.keys(byAx).forEach(ax=>{h+=`<div class="grow"><div class="axis-h">${ax}</div></div>`;
      byAx[ax].forEach(a=>{h+=`<div class="grow arow" onclick="openAct(${a.id})"><div class="alabel"><span class="nm">${a.name}</span><span class="meta">${a.source==='節奏'?'<span class="badge b-jz">行銷節奏</span>':'<span class="badge b-src">營運</span>'}</span></div>`;FISCAL.forEach(([y,m],i)=>h+=cellHTML(a,y,m,i));h+='</div>';});});
  });
  document.getElementById('gscroll').innerHTML=h;
}
function renderList(){const groups=groupByUnit(filtered());let h='';if(!groups.length)h='<div class="miss">沒有符合條件的活動。</div>';
  groups.forEach(([unit,list])=>{h+=`<div class="lgroup"><div class="unit-h" style="border-radius:10px;margin-bottom:6px;">${unit}<span class="cnt">${list.length} 項</span></div>`;
    list.forEach(a=>{let mini='';FISCAL.forEach(([y,m])=>{const c=mData(a,y,m);mini+=`<div class="mc ${c?c.phase:''}"></div>`;});
      h+=`<div class="litem" onclick="openAct(${a.id})"><div class="top"><span style="font-weight:500">${a.name}</span><span class="badge ${a.source==='節奏'?'b-jz':'b-src'}">${a.source==='節奏'?'行銷節奏':'營運'}</span><span style="color:var(--hint);font-size:12px">${a.axis}</span></div><div class="mini">${mini}</div></div>`;});h+='</div>';});
  document.getElementById('listv').innerHTML=h;}
function openAct(id){const a=ACT.activities.find(x=>x.id===id);if(!a)return;let body='';
  FISCAL.forEach(([y,m])=>{const c=mData(a,y,m);if(!c)return;const star=mEvent(a,y,m)?' ★':'';
    body+=`<div class="mblock"><div class="mo">${m}月<span class="yy">${y}</span>${star}<span class="pp ${c.phase}">${PHASE[c.phase]}</span></div><div class="tasks">${c.ops.map(t=>'<div>· '+t+'</div>').join('')}</div></div>`;});
  document.getElementById('drawer').innerHTML=`<div class="dhd"><button class="dclose" onclick="closeDrawer()">×</button><h3>${a.name}</h3><div class="dmeta"><span class="badge">${a.unit}</span><span class="badge">${a.axis}</span><span class="badge">${a.source==='節奏'?'行銷節奏':'營運總表'}</span></div></div><div class="dbody">${body}</div>`;
  document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on');}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
/* ====== view ====== */
function render(){
  const cal=view==='cal';
  document.getElementById('calWrap').classList.toggle('hide',!cal);
  ['stats','gtools'].forEach(id=>document.getElementById(id).classList.toggle('hide',cal||(id==='gtools'&&view!=='gantt')));
  document.querySelector('.ctrl').classList.toggle('hide',cal);
  document.querySelector('.filters').classList.toggle('hide',cal);
  document.querySelector('.legend').classList.toggle('hide',cal);
  document.getElementById('gantt').classList.toggle('hide',view!=='gantt');
  document.getElementById('listv').classList.toggle('on',view==='list');
  if(cal)renderCalendar();
  else{renderControls();renderStats();if(view==='gantt')renderGantt();else renderList();}
}
function setView(v){view=v;tCal.classList.toggle('on',v==='cal');tGantt.classList.toggle('on',v==='gantt');tList.classList.toggle('on',v==='list');render();}
fAxis.onchange=render;document.getElementById('fSearch').oninput=render;syncAxis();render();
</script></body></html>
